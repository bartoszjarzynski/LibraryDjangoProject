<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">
</head>
<body>
    <div class="navbar">
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'books' %}" {% if request.resolver_match.url_name == 'books' %}class="active"{% endif %}>Books and Authors</a></li>
            <li><a href="{% url 'genres' %}" {% if request.resolver_match.url_name == 'genres' %}class="active"{% endif %}>Genres</a></li>
            <li><a href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>About</a></li>
            {% if user.is_authenticated %}
                <li class="logout-link">
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">Logout</button>
                    </form>
                </li>
            {% else %}
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'register' %}">Register</a></li>
            {% endif %}
        </ul>
    </div>

    <div class="content">
        {% block content %}
            {% endblock %}
    </div>

</body>
</html>
